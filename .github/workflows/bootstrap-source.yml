name: Bootstrap DSM source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: contains(github.event.head_commit.message, '[bootstrap-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V1 source
        run: unzip -o dropship-social-v1-source.zip -d .
      - name: Remove bootstrap archive and commit source
        run: |
          rm -f dropship-social-v1-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import DSM V1 source"
          git push
