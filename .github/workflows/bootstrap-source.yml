name: Bootstrap DSM source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: contains(github.event.head_commit.message, '[bootstrap-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract DSM V1 source
        run: tar --exclude='.github/workflows/*' -xJf .bootstrap/dsm-source.tar.xz -C .
      - name: Clean bootstrap and commit source
        run: |
          rm -rf .bootstrap
          rm -f dropship-social-v1-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import DSM V1 source"
          git push
